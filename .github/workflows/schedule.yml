name: Run Daily Trading Bot

on:
  schedule:
    # Runs at 20:30 UTC (4:00 PM EST / 3:30 PM EDT) every Monday through Friday
    - cron: '30 20 * * 1-5'
  workflow_dispatch: # Allows you to manually click "Run" anytime to test it

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-node-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-trade-api pandas

      - name: Execute Bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }} # Note: The code maps this to ALPACA_SECRET_KEY
        run: python bot.py
