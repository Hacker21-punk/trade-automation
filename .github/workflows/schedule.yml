name: Run Daily Trading Bot

on:
  schedule:
    # Runs at 20:30 UTC (4:00 PM EST) every Monday through Friday
    - cron: '30 20 * * 1-5'
  workflow_dispatch: # Allows you to manually click "Run" anytime to test it

# Force all GitHub Actions backend structures to clean Node24 execution environment
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2  # Upgraded to ensure runtime compatibility

      - name: Setup Python
        uses: actions/setup-python@v5.4.0  # Upgraded to ensure runtime compatibility
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-trade-api pandas

      - name: Execute Bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python bot.py
